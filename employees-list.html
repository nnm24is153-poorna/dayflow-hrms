<!DOCTYPE html>
<html>
<head>
    <title>DayFlow - Employees</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
        h1 { color: #1a1a2e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-top: 20px; }
        .card { background: white; border-radius: 10px; padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); position: relative; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; background: #dbe4ff; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 24px; color: #4a5fc1; font-weight: bold; }
        .name { font-weight: bold; margin-top: 8px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; position: absolute; top: 12px; right: 12px; }
        .present { background: #2ecc71; }
        .absent { background: #f1c40f; }
        .leave { font-size: 16px; position: absolute; top: 10px; right: 10px; }
        .checkin-btn { margin-top: 20px; padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .checkout-btn { background: #e74c3c; }
    </style>
</head>
<body>

<h1>DayFlow — Employees</h1>

<div>
    <button class="checkin-btn" onclick="checkIn()">Check In</button>
    <button class="checkin-btn checkout-btn" onclick="checkOut()">Check Out</button>
</div>

<div class="grid" id="employeeGrid"></div>

<script>
const API_URL = "http://127.0.0.1:5000";

// Get logged-in employee id (from login page storage)
function getUser() {
  const raw = localStorage.getItem('dayflow_user');
  try { return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}

const currentUser = getUser();
const currentEmployeeId = currentUser ? currentUser.id : null;

if (!currentEmployeeId) {
  window.location.href = 'login.html'; // bounce back if not logged in
}// TODO: replace with actual logged-in user id

async function loadEmployees() {
    const empRes = await fetch(`${API_URL}/employees`);
    const employees = await empRes.json();

    const statusRes = await fetch(`${API_URL}/attendance/today`);
    const statusMap = await statusRes.json();

    const grid = document.getElementById("employeeGrid");
    grid.innerHTML = "";

    employees.forEach(emp => {
        const status = statusMap[emp.id] || "absent";
        let dotHtml = "";
        if (status === "present") dotHtml = `<div class="status-dot present"></div>`;
        else if (status === "leave") dotHtml = `<div class="leave">✈️</div>`;
        else dotHtml = `<div class="status-dot absent"></div>`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            ${dotHtml}
            <div class="avatar">${emp.name.charAt(0).toUpperCase()}</div>
            <div class="name">${emp.name}</div>
            <div style="color:gray; font-size:13px;">${emp.role}</div>
        `;
        grid.appendChild(card);
    });
}

async function checkIn() {
    await fetch(`${API_URL}/attendance/checkin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employee_id: currentEmployeeId })
    });
    loadEmployees();
}

async function checkOut() {
    await fetch(`${API_URL}/attendance/checkout`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employee_id: currentEmployeeId })
    });
    loadEmployees();
}

loadEmployees();
</script>

</body>
</html>
